[project]
name = "cosmosx-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "krishant Daimari", email = "krishantdaimari3@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "skyfield>=1.55",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cosmosx-backend = "cosmosx_backend:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
